[package]
name = "virtual-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "virtual"
path = "src/main.rs"

[dependencies]
rusty_link = "=0.4.9"
virtual-core.workspace = true
virtual-generate.workspace = true
virtual-graph.workspace = true
virtual-io.workspace = true
virtual-media.workspace = true
virtual-render.workspace = true
virtual-session.workspace = true

anyhow.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
env_logger.workspace = true
libloading.workspace = true
log.workspace = true
pollster.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true

# Cursor position at drop time: winit 0.30 reports no position for files
# dragged in from Finder.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes"] }
