name: Native desktop builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master, 'build/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config patchelf \
            libavcodec-dev libavformat-dev libavdevice-dev libavutil-dev libswscale-dev \
            libswresample-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - name: Test CPU and media libraries
        run: cargo test --locked -p virtual-core -p virtual-graph -p virtual-hap -p virtual-media -p virtual-io -p virtual-session --lib
      - name: Build Linux archive
        run: sh scripts/build-linux.sh
      - name: Check archive on a clean baseline
        # A stock Ubuntu 24.04 plus the desktop libraries the archive leaves to
        # the host (scripts/package-linux-libs.py, HOST_LIBRARIES). Any
        # library the archive needs that is neither bundled nor listed here
        # fails the check by name.
        # Failures are echoed as an annotation so they are visible without
        # access to the job log.
        run: |
          for attempt in 1 2 3; do docker pull -q ubuntu:24.04 && break; sleep 15; done
          docker run --rm -v "$PWD/target/dist:/artifacts:ro" ubuntu:24.04 sh -ec '
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              libstdc++6 libgcc-s1 libasound2t64 libdbus-1-3 libudev1 \
              libdrm2 libgbm1 libgl1 libegl1 libvulkan1 \
              libx11-6 libx11-xcb1 libxext6 libxfixes3 libxrender1 libxv1 \
              libxcursor1 libxi6 libxrandr2 libxss1 \
              libxcb1 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-xfixes0 libxcb-dri3-0 \
              libxkbcommon0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
              >/dev/null
            tar -xzf /artifacts/VIRTUAL-*-linux-x86_64.tar.gz -C /tmp
            missing=$(for file in /tmp/VIRTUAL/virtual /tmp/VIRTUAL/lib/*; do ldd "$file"; done | grep "not found" | sort -u || true)
            if [ -n "$missing" ]; then echo "Host libraries missing:"; echo "$missing"; exit 1; fi
            cd /
            /tmp/VIRTUAL/VIRTUAL --version
          ' > clean-baseline.log 2>&1 || {
            code=$?
            cat clean-baseline.log
            echo "::error title=Clean-baseline check (exit $code)::$(tail -n 25 clean-baseline.log | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"
            exit "$code"
          }
          cat clean-baseline.log
      - uses: actions/upload-artifact@v4
        with:
          name: VIRTUAL-linux-x86_64
          path: target/dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # Must equal builtin-baseline in packaging/windows/vcpkg.json. The
      # runner image's preinstalled vcpkg changes weekly and may predate it.
      VCPKG_COMMIT: c3867e714dd3a51c272826eea77267876517ed99
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned vcpkg
        shell: pwsh
        run: |
          $Root = "$env:RUNNER_TEMP/vcpkg"
          git init --quiet $Root
          git -C $Root fetch --quiet --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $Root checkout --quiet FETCH_HEAD
          & "$Root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Baseline = (Get-Content packaging/windows/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          if ($Baseline -ne $env:VCPKG_COMMIT) { throw "vcpkg.json baseline $Baseline differs from VCPKG_COMMIT" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-cache" | Out-Null
      - name: Restore vcpkg binary cache
        # Built FFmpeg packages, keyed by vcpkg commit and manifest; vcpkg's own
        # ABI hashes decide reuse, so a partial restore is safe.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-x64-windows-${{ env.VCPKG_COMMIT }}-${{ hashFiles('packaging/windows/vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-${{ env.VCPKG_COMMIT }}-
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0
      - name: Build Windows archive
        shell: pwsh
        run: |
          $VS = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$VS/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $VS -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:LIBCLANG_PATH = 'C:/Program Files/LLVM/bin'
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$env:RUNNER_TEMP/vcpkg-cache"
          ./scripts/build-windows.ps1 -VcpkgRoot "$env:RUNNER_TEMP/vcpkg"
          cargo test --locked --target x86_64-pc-windows-msvc -p virtual-core -p virtual-graph -p virtual-hap -p virtual-media -p virtual-io -p virtual-session --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: VIRTUAL-windows-x86_64
          path: target/dist/*
          if-no-files-found: error
