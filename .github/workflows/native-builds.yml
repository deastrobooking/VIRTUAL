name: Native desktop builds

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master, 'build/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config patchelf \
            libavcodec-dev libavformat-dev libavdevice-dev libavutil-dev libswscale-dev \
            libswresample-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - name: Test CPU and media libraries
        run: cargo test --locked -p virtual-core -p virtual-graph -p virtual-hap -p virtual-media -p virtual-io -p virtual-session --lib
      - name: Build Linux archive
        run: sh scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VIRTUAL-linux-x86_64
          path: target/dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0
      - name: Build Windows archive
        shell: pwsh
        run: |
          $VS = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$VS/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $VS -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:LIBCLANG_PATH = 'C:/Program Files/LLVM/bin'
          ./scripts/build-windows.ps1 -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT
          cargo test --locked --target x86_64-pc-windows-msvc -p virtual-core -p virtual-graph -p virtual-hap -p virtual-media -p virtual-io -p virtual-session --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: VIRTUAL-windows-x86_64
          path: target/dist/*
          if-no-files-found: error
